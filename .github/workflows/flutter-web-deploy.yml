name: Flutter Web Build and Deploy

on:
  workflow_call:
    secrets:
      deployment_token:
        required: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Run tests when present
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo '::warning::No Flutter unit/widget tests found. Test coverage is not verified.'
          fi

      - name: Build release web application
        working-directory: app
        run: flutter build web --release

      - name: Verify deployment output
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/web/index.html
          cp app/staticwebapp.config.json app/build/web/staticwebapp.config.json
          test -s app/build/web/staticwebapp.config.json

      - name: Deploy prebuilt web application
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.deployment_token }}
          action: upload
          app_location: app/build/web
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Write deployment summary
        env:
          SITE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: echo "Website URL is $SITE_URL" >> "$GITHUB_STEP_SUMMARY"